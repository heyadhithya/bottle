name: Contribution validation
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact contribution commit to test
        required: true
        default: d3694656b107d32356833b13e72c78d237d0a0e9
permissions:
  contents: read
jobs:
  bottle-tests:
    name: Python ${{ matrix.python }} Bottle suite
    # setup-python has no Python 3.9 build for Ubuntu 26.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Install development dependencies
        run: python -m pip install '.[dev]'
      - name: Run full Bottle suite
        run: python -m pytest -ra -q --cov=bottle --cov-report=term
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
